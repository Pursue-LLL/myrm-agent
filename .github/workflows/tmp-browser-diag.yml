name: TMP browser teardown diagnosis

on:
  push:
    branches:
      - monorepo/harness-import
    paths:
      - '.github/workflows/tmp-browser-diag.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: myrm-agent-harness

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"
      - run: uv python install 3.13
      - run: uv sync --python 3.13 --locked --extra browser --group dev
      - run: uv run --no-sync patchright install --with-deps chromium
      - name: Write probe
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio, sys, time, threading, traceback
          from http.server import HTTPServer, SimpleHTTPRequestHandler
          import tempfile, pathlib, functools

          VARIANT = sys.argv[1]

          def log(msg):
              print(f"[{VARIANT}] {time.monotonic() - T0:6.2f}s {msg}", flush=True)

          async def step(name, coro, limit=20):
              log(f"{name}: begin")
              try:
                  await asyncio.wait_for(coro, limit)
                  log(f"{name}: ok")
              except asyncio.TimeoutError:
                  log(f"{name}: HUNG > {limit}s")
                  for t in asyncio.all_tasks():
                      print("TASK", t.get_name(), t.get_coro(), flush=True)
                      for f in t.get_stack(limit=6):
                          print("   ", f.f_code.co_filename.split("site-packages/")[-1], f.f_lineno, f.f_code.co_name, flush=True)
                  return False
              return True

          async def main():
              from patchright.async_api import async_playwright
              tmp = pathlib.Path(tempfile.mkdtemp())
              (tmp / "p1.html").write_text("<html><body><button id='b'>p1</button></body></html>")
              server = HTTPServer(("127.0.0.1", 0), functools.partial(SimpleHTTPRequestHandler, directory=str(tmp)))
              threading.Thread(target=server.serve_forever, daemon=True).start()
              url = f"http://127.0.0.1:{server.server_port}/p1.html"

              pw = await async_playwright().start()
              browser = await pw.chromium.launch(headless=True)
              page = await browser.new_page()
              await page.goto(url)

              if VARIANT in ("bridge", "engine"):
                  seen = []
                  async def cb(raw):
                      seen.append(raw)
                  await page.expose_function("__bridge", cb)
                  await page.evaluate("document.addEventListener('click', () => window.__bridge('x'))", isolated_context=False)
                  await page.click("#b")
                  await asyncio.sleep(0.4)
                  log(f"bridge calls: {len(seen)}")

              if VARIANT == "engine":
                  from myrm_agent_harness.toolkits.browser.action_capture.capture_engine import ActionCaptureEngine
                  page2 = await browser.new_page()
                  await page2.goto(url)
                  eng = ActionCaptureEngine(page2, capture_screenshots=False)
                  await eng.start()
                  await page2.click("#b")
                  await asyncio.sleep(0.4)
                  await step("engine.stop", eng.stop())

              await step("browser.close", browser.close())
              await step("pw.stop", pw.stop())
              server.shutdown()
              log("done")

          T0 = time.monotonic()
          asyncio.run(main())
          PY
      - name: Variant plain
        if: always()
        run: timeout 120 uv run --no-sync python /tmp/probe.py plain
      - name: Variant bridge
        if: always()
        run: timeout 120 uv run --no-sync python /tmp/probe.py bridge
      - name: Variant engine
        if: always()
        run: timeout 120 uv run --no-sync python /tmp/probe.py engine
      - name: Variant pytest single test
        if: always()
        run: >-
          timeout 200 uv run --no-sync pytest -n0 -v -s --tb=short
          tests/toolkits/browser/action_capture/test_capture_engine_navigation_integration.py
          -m integration --timeout=150 --timeout-method=thread -o faulthandler_timeout=60
