name: TMP browser teardown diagnosis

on:
  push:
    branches:
      - monorepo/harness-import
    paths:
      - '.github/workflows/tmp-browser-diag.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: myrm-agent-harness

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"
      - run: uv python install 3.13
      - run: uv sync --python 3.13 --locked --extra all --group dev
      - run: uv run --no-sync patchright install --with-deps chromium
      - name: Write diagnostic plugin
        run: |
          mkdir -p /tmp/diag
          cat > /tmp/diag/diagplugin.py <<'PY'
          import asyncio, gc, subprocess, sys, threading
          import pytest

          def _chain(coro):
              out = []
              while coro is not None:
                  frame = getattr(coro, "cr_frame", None) or getattr(coro, "ag_frame", None) or getattr(coro, "gi_frame", None)
                  if frame is not None:
                      out.append(f"{frame.f_code.co_filename.split('site-packages/')[-1]}:{frame.f_lineno} {frame.f_code.co_name}")
                  nxt = getattr(coro, "cr_await", None) or getattr(coro, "ag_await", None) or getattr(coro, "gi_yieldfrom", None)
                  if nxt is not None and not hasattr(nxt, "cr_frame") and not hasattr(nxt, "gi_frame") and not hasattr(nxt, "ag_frame"):
                      out.append(f"awaiting {nxt!r}")
                      break
                  coro = nxt
              return out

          def _dump(label):
              print(f"[diag] ===== stall dump for {label} =====", file=sys.stderr, flush=True)
              for obj in gc.get_objects():
                  if isinstance(obj, asyncio.BaseEventLoop) and obj.is_running():
                      def cb(loop=obj):
                          for t in asyncio.all_tasks(loop):
                              print(f"[diag] TASK {t.get_name()}", file=sys.stderr)
                              for line in _chain(t.get_coro()):
                                  print(f"[diag]     {line}", file=sys.stderr)
                          import inspect
                          for g in gc.get_objects():
                              if inspect.isasyncgen(g) and g.ag_await is not None:
                                  print(f"[diag] ASYNCGEN {g.ag_code.co_filename.split('tests/')[-1]}:{g.ag_frame.f_lineno} {g.ag_code.co_name}", file=sys.stderr)
                                  for line in _chain(g.ag_await):
                                      print(f"[diag]     {line}", file=sys.stderr)
                          sys.stderr.flush()
                      obj.call_soon_threadsafe(cb)
              print(subprocess.run(["ps", "-eo", "pid,ppid,stat,etime,cmd", "--sort=start_time"], capture_output=True, text=True).stdout[-3000:], file=sys.stderr, flush=True)

          def pytest_configure(config):
              import os, traceback
              import myrm_agent_harness.toolkits.browser.pool.browser_pool as bp
              real_init = bp.GlobalBrowserPool.__init__
              def spy(self, *a, **k):
                  print(f"[diag] POOL INIT during {os.environ.get('PYTEST_CURRENT_TEST', '<collection>')}\n" + "".join(traceback.format_stack(limit=10)[:-1]), file=sys.stderr, flush=True)
                  real_init(self, *a, **k)
              bp.GlobalBrowserPool.__init__ = spy

          _seen = {"state": False}

          def _pool_state():
              mod = sys.modules.get("myrm_agent_harness.toolkits.browser.pool.singleton")
              return bool(mod is not None and mod._global_pool is not None)

          @pytest.hookimpl(hookwrapper=True)
          def pytest_runtest_teardown(item, nextitem):
              timer = threading.Timer(45, _dump, args=(item.nodeid,))
              timer.daemon = True
              timer.start()
              try:
                  yield
              finally:
                  timer.cancel()
                  now = _pool_state()
                  if now != _seen["state"]:
                      print(f"[diag] GLOBAL POOL {'CREATED' if now else 'CLEARED'} by {item.nodeid}", file=sys.stderr, flush=True)
                      _seen["state"] = now
          PY
      - name: Full serial browser integration with stall dump
        run: >-
          PYTHONPATH=/tmp/diag uv run --no-sync pytest -p diagplugin -n0 -v -s --tb=short tests/
          -m "integration or e2e" --timeout=120 --timeout-method=thread -o faulthandler_timeout=100
