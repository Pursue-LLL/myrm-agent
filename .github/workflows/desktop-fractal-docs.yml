name: Desktop fractal docs

on:
  push:
    branches:
      - main
    paths:
      - 'myrm-agent-desktop/**'
      - 'scripts/ci/desktop-release/**'
      - '.github/workflows/desktop-fractal-docs.yml'
  pull_request:
    paths:
      - 'myrm-agent-desktop/**'
      - 'scripts/ci/desktop-release/**'
      - '.github/workflows/desktop-fractal-docs.yml'

concurrency:
  group: desktop-fractal-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fractal-docs:
    name: Desktop fractal documentation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: latest

      - name: Fractal docs gate
        run: bun run myrm-agent-desktop/scripts/check-fractal-docs.ts

      - name: Fractal docs unit test
        run: bun test myrm-agent-desktop/scripts/check-fractal-docs.test.ts

      # The release scripts only run during a release build; a syntax error there would otherwise
      # surface after the expensive platform builds.
      - name: Desktop CI shell script lint
        run: |
          for script in scripts/ci/desktop-release/*.sh myrm-agent-desktop/scripts/ci/*.sh; do
            bash -n "$script"
          done
          shellcheck --severity=error -x scripts/ci/desktop-release/*.sh myrm-agent-desktop/scripts/ci/*.sh

      - name: Desktop CI PowerShell script syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts/ci/desktop-release -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($err in $errors) {
              Write-Host "$($file.Name): $($err.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # libxdo-dev: enigo (synthetic keyboard input) links libxdo on Linux; `cargo test` links, `cargo check` does not.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential libssl-dev libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: myrm-agent-desktop/src-tauri

      - name: Desktop launch contract smoke
        run: bash myrm-agent-desktop/scripts/ci/verify-launch-contract.sh

      - name: Desktop Rust cargo check
        run: bash myrm-agent-desktop/scripts/ci/cargo-check.sh

  # The shell carries Windows-only code (screen capture, capture exclusion, window activation) that the
  # Linux job never compiles; without this job a type error there only surfaces in a release build.
  shell-windows:
    name: Desktop shell compile gate (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: myrm-agent-desktop/src-tauri

      - name: Desktop Rust cargo check
        shell: bash
        run: bash myrm-agent-desktop/scripts/ci/cargo-check.sh
