name: Harness tool registry

on:
  pull_request:
    paths:
      - 'myrm-agent-harness/src/myrm_agent_harness/**/*.py'
      - 'myrm-agent-harness/src/myrm_agent_harness/agent/tool_management/**'
      - 'myrm-agent-harness/tests/architecture/test_tool_registry.py'
      - 'myrm-agent-harness/scripts/tool_registry_*.py'
      - 'myrm-agent-harness/scripts/validate_tool_registry.py'
      - 'myrm-agent-server/app/**/*.py'
      - '.github/workflows/harness-tool-registry.yml'

permissions:
  contents: read

concurrency:
  group: harness-tool-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: myrm-agent-harness

jobs:
  tool-registry-check:
    name: Tool registry consistency (harness + server bootstrap)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --locked --dev

      - name: Run full tool-registry validation
        run: uv run --no-sync python scripts/validate_tool_registry.py

      - name: Verify docs counts are in sync
        run: |
          uv run --no-sync python scripts/validate_tool_registry.py --generate-docs
          if ! git diff --quiet -- src/myrm_agent_harness/agent/tool_management/; then
            echo "::error::Docs are out of sync. Run scripts/validate_tool_registry.py --generate-docs locally and commit the result."
            git diff -- src/myrm_agent_harness/agent/tool_management/
            exit 1
          fi
