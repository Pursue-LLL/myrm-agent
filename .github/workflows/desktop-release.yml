name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # A tag run publishes a release. Any other run (workflow_dispatch on a branch) builds and verifies the
  # packages only, with a numeric-only pre-release version so the MSI bundler accepts it.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-{0}', github.run_number) }}

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-frontend:
    name: Prepare frontend (build once)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: latest

      - name: Inject version from tag
        run: bash scripts/ci/desktop-release/inject-version.sh "$RELEASE_TAG"

      - name: Check updater pubkey vs signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash scripts/ci/desktop-release/check-updater-pubkey.sh

      - name: Install frontend dependencies
        run: |
          cd myrm-agent-frontend
          bun install

      - name: Build frontend for Tauri
        run: |
          cd myrm-agent-frontend
          bun run build:tauri

      # tauri.conf.json bundles `.next/standalone` (the server) and `.next/static` (client assets).
      # The server's compiled output lives in `standalone/<app>/.next/`, a hidden folder that
      # upload-artifact silently skips unless told otherwise; a server without it cannot start.
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: frontend-tauri-build
          path: |
            myrm-agent-frontend/.next/standalone
            myrm-agent-frontend/.next/static
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # macOS ships for Apple Silicon only. PyInstaller cannot cross-compile, so an Intel app needs a sidecar frozen on an
  # Intel host, and the locked dependency set (onnxruntime) has no macOS x86_64 wheel to install there.
  build-macos-arm:
    name: Build macOS Apple Silicon
    needs: prepare-frontend
    # Runner images are pinned to a concrete release (never `macos-latest`) so the OS does not change under a release build.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build desktop sidecar
        uses: ./.github/actions/build-sidecar
        with:
          arch: arm64
          rust-target: aarch64-apple-darwin

      - name: Fetch Node.js runtime
        run: python myrm-agent-desktop/scripts/fetch_node_runtime.py --target aarch64-apple-darwin

      - name: Export Apple signing env (only when configured)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ci/desktop-release/export-apple-signing-env.sh

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: myrm-agent-desktop
          args: --target aarch64-apple-darwin

      - name: Launch runtime smoke (.app)
        run: |
          APP="$(find myrm-agent-desktop/src-tauri/target -path '*/release/bundle/macos/*.app' ! -path '*.app/*' -type d 2>/dev/null | head -1)"
          if [[ -z "$APP" ]]; then
            echo "[launch-smoke] no .app bundle found under target/release/bundle/macos" >&2
            exit 1
          fi
          python scripts/ci/desktop-release/smoke_launch_shell.py --bundle "$APP"

      - name: Launch runtime smoke (updater tarball)
        run: |
          TARBALL="$(find myrm-agent-desktop/src-tauri/target -path '*/release/bundle/macos/*.app.tar.gz' ! -path '*.app/*' -type f 2>/dev/null | head -1)"
          if [[ -z "$TARBALL" ]]; then
            echo "[launch-smoke] no updater tarball found under target/release/bundle/macos" >&2
            exit 1
          fi
          EXTRACTED="$(mktemp -d)"
          tar -xzf "$TARBALL" -C "$EXTRACTED"
          APP="$(find "$EXTRACTED" -maxdepth 1 -name '*.app' -type d | head -1)"
          if [[ -z "$APP" ]]; then
            echo "[launch-smoke] the updater tarball holds no .app" >&2
            exit 1
          fi
          # A translocated .app is read-only; so is the install directory the shell and its servers must live with.
          chmod -R a-w "$EXTRACTED"
          python scripts/ci/desktop-release/smoke_launch_shell.py --bundle "$APP"

      - name: Ensure updater bundle signatures
        env:
          REQUIRE_UPDATER_BUNDLES: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/ci/desktop-release/sign-updater-bundles.sh

      - name: Upload macOS ARM artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: artifacts-macos-apple-silicon
          path: |
            myrm-agent-desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            myrm-agent-desktop/src-tauri/target/**/release/bundle/macos/*.tar.gz
            myrm-agent-desktop/src-tauri/target/**/release/bundle/*/*.sig
          retention-days: 1

  publish-release:
    name: Publish GitHub Release (macOS ARM)
    needs: build-macos-arm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build-macos-arm.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download macOS ARM artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: artifacts-macos-apple-silicon
          path: artifacts

      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.sig" \) -exec cp {} release-assets/ \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true

  build-windows:
    name: Build windows
    needs:
      - prepare-frontend
      - publish-release
    if: >-
      !cancelled() &&
      needs.prepare-frontend.result == 'success' &&
      (github.ref_type != 'tag' || needs.publish-release.result == 'success')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build desktop sidecar
        uses: ./.github/actions/build-sidecar
        with:
          arch: x86_64

      - name: Fetch Node.js runtime
        run: python myrm-agent-desktop/scripts/fetch_node_runtime.py --target x86_64-pc-windows-msvc

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: myrm-agent-desktop
          args: ''

      - name: Rename Windows updater bundle (stable OTA asset name)
        shell: pwsh
        run: ./scripts/ci/desktop-release/rename-windows-updater-bundle.ps1

      - name: Launch runtime smoke (silent NSIS install)
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'myrm-agent-desktop/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) { Write-Error 'No NSIS installer found'; exit 1 }
          $installDir = Join-Path $env:RUNNER_TEMP 'MyrmAgent-install'
          # /D must be the last argument and must not be quoted.
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait
          python scripts/ci/desktop-release/smoke_launch_shell.py --bundle "$installDir"

      - name: Ensure updater bundle signatures
        env:
          REQUIRE_UPDATER_BUNDLES: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/ci/desktop-release/sign-updater-bundles.sh
        shell: bash

      - name: Upload assets to existing GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=()
          while IFS= read -r f; do
            [[ -n "$f" ]] && files+=("$f")
          done < <(bash scripts/ci/desktop-release/collect-bundle-assets.sh)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
        shell: bash

  build-linux:
    name: Build linux
    needs:
      - prepare-frontend
      - publish-release
    if: >-
      !cancelled() &&
      needs.prepare-frontend.result == 'success' &&
      (github.ref_type != 'tag' || needs.publish-release.result == 'success')
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # libxdo-dev: enigo (synthetic keyboard input) links libxdo on Linux; without it the shell compiles but
      # does not link. xvfb: the launch smoke starts the real shell, which needs a display.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 \
            build-essential curl wget file libssl-dev libxdo-dev xvfb

      - name: Build desktop sidecar
        uses: ./.github/actions/build-sidecar
        with:
          arch: x86_64

      - name: Prune linuxmusl native packages from frontend standalone
        run: bash scripts/ci/desktop-release/prune-frontend-linuxmusl.sh

      - name: Fetch Node.js runtime
        run: python myrm-agent-desktop/scripts/fetch_node_runtime.py --target x86_64-unknown-linux-gnu

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: myrm-agent-desktop
          # Website distributes AppImage only; skip deb/rpm to cut Linux CI time ~40%.
          args: --bundles appimage --verbose

      - name: Launch runtime smoke (extracted AppImage)
        run: |
          APPIMAGE="$(find myrm-agent-desktop/src-tauri/target -path '*/release/bundle/appimage/*.AppImage' ! -path '*.AppDir/*' -type f 2>/dev/null | head -1)"
          if [[ -z "$APPIMAGE" ]]; then
            echo "[launch-smoke] no AppImage found under target/release/bundle/appimage" >&2
            exit 1
          fi
          APPIMAGE="$(realpath "$APPIMAGE")"
          EXTRACTED="$(mktemp -d)"
          chmod +x "$APPIMAGE"
          (cd "$EXTRACTED" && "$APPIMAGE" --appimage-extract >/dev/null)
          # A mounted AppImage is read-only: run the smoke the same way, so a shell or backend that writes into its
          # own install directory fails here instead of on a user's machine.
          chmod -R a-w "$EXTRACTED/squashfs-root"
          xvfb-run -a python scripts/ci/desktop-release/smoke_launch_shell.py --bundle "$EXTRACTED/squashfs-root"

      - name: Ensure updater bundle signatures
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/ci/desktop-release/sign-updater-bundles.sh

      - name: Upload assets to existing GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=()
          while IFS= read -r f; do
            [[ -n "$f" ]] && files+=("$f")
          done < <(bash scripts/ci/desktop-release/collect-bundle-assets.sh)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  finalize-release:
    name: Finalize manifest (latest.json + sha256)
    needs:
      - publish-release
      - build-windows
    if: >-
      always() &&
      needs.publish-release.result == 'success' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate and upload latest.json + checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REQUIRED_OTA_PLATFORM_KEYS: darwin-aarch64 windows-x86_64
        run: bash scripts/ci/desktop-release/finalize-release.sh

      - name: Verify release manifest and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REQUIRE_MIN_OTA_PLATFORMS: '2'
          REQUIRED_OTA_PLATFORM_KEYS: darwin-aarch64 windows-x86_64
          REQUIRED_INSTALLER_GLOBS: '*aarch64*.dmg *.msi'
        run: bash scripts/ci/desktop-release/verify-release.sh

  refinalize-after-linux:
    name: Refinalize manifest after Linux upload
    needs:
      - finalize-release
      - build-linux
    if: >-
      always() &&
      needs.finalize-release.result == 'success' &&
      needs.build-linux.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Regenerate latest.json + checksums (include Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REQUIRED_OTA_PLATFORM_KEYS: darwin-aarch64 windows-x86_64 linux-x86_64
        run: bash scripts/ci/desktop-release/finalize-release.sh

      - name: Verify release manifest and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REQUIRE_MIN_OTA_PLATFORMS: '3'
          REQUIRED_OTA_PLATFORM_KEYS: darwin-aarch64 windows-x86_64 linux-x86_64
          REQUIRED_INSTALLER_GLOBS: '*aarch64*.dmg *.msi'
          REQUIRE_BARE_LINUX_APPIMAGE: '1'
        run: bash scripts/ci/desktop-release/verify-release.sh
