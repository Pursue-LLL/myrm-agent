name: Frontend build

# The paths cover what the jobs read: the frontend, shared/, and the compose file whose frontend service the
# docker-image job runs.
on:
  push:
    branches:
      - main
    paths:
      - 'myrm-agent-frontend/**'
      - 'shared/**'
      - 'myrm-agent-server/docker-compose.yaml'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'myrm-agent-frontend/**'
      - 'shared/**'
      - 'myrm-agent-server/docker-compose.yaml'
      - '.github/workflows/frontend-build.yml'

concurrency:
  # The orphan check of a push compares it with the commit main pointed at before that push, so a run cancelled by the
  # next push would leave the first push's orphans unchecked forever. Only a pull request is superseded by a newer run.
  group: frontend-build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: myrm-agent-frontend
    steps:
      # Full history: the orphan gate's diff mode needs the merge-base with the pull request's base branch, or the
      # commit a push replaced.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lockfile policy (bun SSOT, no package-lock.json)
        run: test ! -f package-lock.json
      # locales/namespaces/ is gitignored build output that source files import; tsc and the
      # module-resolution gate need it present, exactly as `dev` and `pretest` generate it.
      - name: Generate locale namespaces
        run: bun run i18n:split
      # The gates below are independent: one red gate must not hide the others, so a single
      # run lists every failing gate instead of exposing them one push at a time.
      # `lint` runs every static gate and lists all the red ones; the gate list lives in
      # myrm-agent-frontend/scripts/run-lint-gates.ts.
      - name: Lint gates (every gate runs; oxlint errors fail, warnings non-blocking)
        if: ${{ !cancelled() }}
        run: bun run lint
      - name: TypeScript strict (no error count regression)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_typescript_strict.py
      - name: Fractal docs (strict roots + recursive baseline)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_fractal_docs.py --no-stub
      # Absolute zero-orphan cannot hold while unwired work is in flight, so a change may not introduce
      # orphans relative to what it builds on: a pull request relative to its merge-base, a push to main
      # relative to the commit main pointed at before it. Work lands by push, so the push check is the
      # one that sees it; `bun run verify:orphans` lists the standing orphans on demand.
      - name: Orphan modules (none introduced vs the PR base)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/check-orphan-modules.mjs --base "origin/${BASE_REF}"
      - name: Orphan modules (none introduced by the push)
        if: ${{ !cancelled() && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bun scripts/check-orphan-modules.mjs --base "${BEFORE_SHA}"
      - name: Barrel export policy (cross-domain index.ts whitelist)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_barrel_exports.py
      - name: Module resolution (no dangling import specifiers)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_module_resolution.py
      - name: i18n completeness (verify:i18n)
        if: ${{ !cancelled() }}
        run: bun run verify:i18n
      # The full suite is not run here. These are the contracts no static gate can see: the shared provider remap, the
      # copy that is read through a key built at run time or through a translator the component picks itself (a wrong
      # namespace or a missing key shows the person a raw key path), and the Web Push chain (worker display and click
      # routing, the URL allowlist, the subscription and install hooks, the registrar), which fails silently: no error,
      # the notification just never arrives. The two directories are passed whole so a new test beside them runs
      # without touching this list.
      - name: Vitest (provider remap, run-time translation keys, Web Push chain)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          contracts=(
            src/store/config/__tests__/providerIdentityMigration.test.ts
            src/i18n/__tests__/dynamic-key-families.test.ts
            src/lib/i18n/__tests__/translateOrRaw.test.ts
            src/components/features/background-tasks/__tests__/BackgroundTaskRow.test.tsx
            src/lib/web-push
            src/hooks/pwa
            src/components/features/app-shell/__tests__/service-worker-registrar.test.tsx
          )
          # Vitest reads each path as a name filter and drops one that matches nothing without a word, so a moved or
          # renamed contract would stop running while the step stays green.
          for contract in "${contracts[@]}"; do
            test -e "$contract" || { echo "::error::contract test path does not exist: $contract"; exit 1; }
          done
          bunx vitest run "${contracts[@]}"
      # `build` bundles src/app/sw.ts into public/sw.js (build:sw) before `next build`: it proves the worker still
      # compiles, while its behavior is covered by the Vitest step above.
      - name: Production build (module graph and Web Push service worker bundle)
        if: ${{ !cancelled() }}
        run: bun run build

  # The quickstart's `docker compose --profile app up`, without the backend: the image must build, start under the
  # hardening docker-compose.yaml pins and serve the push worker. `build` cannot see any of this, because the
  # Dockerfile brings its own toolchain and output layout.
  docker-image:
    name: Frontend Docker image (compose service)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and start the frontend service
        working-directory: myrm-agent-server
        run: docker compose --profile app up -d --build --no-deps frontend
      - name: The container serves the push worker
        run: |
          for _ in $(seq 30); do
            curl -fsS -o "$RUNNER_TEMP/sw.js" http://127.0.0.1:3000/sw.js && break
            sleep 2
          done
          if ! grep -q notificationclick "$RUNNER_TEMP/sw.js"; then
            echo "::error::the container did not serve the push worker on /sw.js"
            exit 1
          fi
      - name: Frontend container logs
        if: failure()
        working-directory: myrm-agent-server
        run: docker compose --profile app logs frontend
