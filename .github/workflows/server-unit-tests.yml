name: Server unit tests

on:
  pull_request:
    paths:
      - 'myrm-agent-server/**'
      - 'myrm-agent-harness/src/**'
      - 'myrm-agent-harness/pyproject.toml'
      - 'myrm-agent-harness/uv.lock'
      - 'shared/**'
      - '.github/workflows/server-unit-tests.yml'

concurrency:
  group: server-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# CI has no LLM credentials: tests resolve model identifiers from the environment first, so
# offline placeholders stand in for the developer-only .env.test (e2e tests are excluded).
env:
  BASIC_MODEL: openai/ci-offline-placeholder
  LITE_MODEL: openai/ci-offline-placeholder

jobs:
  default-pytest:
    name: Default pytest (-m not e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: myrm-agent-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Set up Python
        run: uv python install 3.13

      - name: Install promtool
        run: bash scripts/ci/install_promtool.sh

      - name: Run default pytest suite
        run: bash scripts/ci/run_default_tests.sh

  locked-use-pytest:
    name: Locked Use regression (tests/services/locked_use)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: myrm-agent-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Set up Python
        run: uv python install 3.13

      - name: Run Locked Use pytest suite
        run: bash scripts/ci/run_locked_use_tests.sh
