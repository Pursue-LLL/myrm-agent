name: Server unit tests

on:
  pull_request:
    paths:
      - 'myrm-agent-server/**'
      - 'shared/**'
      - '.github/workflows/server-unit-tests.yml'

concurrency:
  group: server-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  default-pytest:
    name: Default pytest (-m not e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: myrm-agent-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@168846c869919b16548f3e583c4b9d0b64d1f2b2 # v4.0.0

      - name: Set up Python
        run: uv python install 3.13

      - name: Run default pytest suite
        run: bash scripts/ci/run_default_tests.sh

  locked-use-pytest:
    name: Locked Use regression (tests/services/locked_use)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: myrm-agent-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@168846c869919b16548f3e583c4b9d0b64d1f2b2 # v4.0.0

      - name: Set up Python
        run: uv python install 3.13

      - name: Run Locked Use pytest suite
        run: bash scripts/ci/run_locked_use_tests.sh
