name: Harness tests

on:
  pull_request:
    paths:
      - 'myrm-agent-harness/**'
      - '!myrm-agent-harness/benchmarks/**'
      - '.github/workflows/harness-test.yml'
  push:
    branches:
      - main
    paths:
      - 'myrm-agent-harness/**'
      - '!myrm-agent-harness/benchmarks/**'
      - '.github/workflows/harness-test.yml'

permissions:
  contents: read

concurrency:
  group: harness-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: myrm-agent-harness

jobs:
  unit:
    name: Unit tests (memory-safe profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The safe_git suite drives a real git-lfs (tests/core/security/safe_git/test_git_lfs_programs.py); without it those cases skip.
      - name: Ensure git-lfs
        run: command -v git-lfs >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends git-lfs; }

      - name: Install uv
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Set up Python
        run: uv python install 3.13

      # Installs exactly what uv.lock pins; a stale lock fails here (run `uv lock` after editing pyproject.toml).
      - name: Install dependencies
        run: uv sync --python 3.13 --locked --extra all --group dev

      - name: Run unit tests
        run: >-
          uv run --no-sync pytest -n 2 --dist=loadscope -q --tb=short tests/
          --junitxml=/tmp/unit.xml

      # Surface which tests failed without downloading the whole job log: the summary is
      # written to the step summary, which is readable from the run page and the API.
      - name: Report failed tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, os, sys, xml.etree.ElementTree as ET

          rows = []
          for path in glob.glob("/tmp/*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          msg = (node.get("message") or "").strip().splitlines()[:2]
                          rows.append((case.get("classname"), case.get("name"), msg))

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Failed tests\n")
                  if not rows:
                      handle.write("No failures recorded in the junit report.\n")
                  for cls, name, msg in rows:
                      handle.write(f"- `{cls}::{name}`\n")
                      for line in msg:
                          handle.write(f"  - {line}\n")

          # Annotations are the only part of a failed job an anonymous reader can fetch,
          # so the failing test ids go there too.
          for cls, name, msg in rows[:40]:
              detail = " | ".join(msg).replace("\n", " ")[:180]
              print(f"::error title={cls}::{name}::{detail}")
          if not rows:
              print("::error title=failed-tests::no junit entries were written")
          sys.exit(0)
          EOF

  windows-computer-use:
    name: Windows computer-use (real Win32)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --locked --extra computer-use --group dev

      # The Windows backend reaches Win32 through ctypes; the doubles used on Linux cannot catch a wrong
      # prototype or structure layout, so the Windows suites and the win32-only smoke run on a real host.
      - name: Run Windows computer-use tests
        run: >-
          uv run --no-sync pytest -n0 -q --tb=short
          tests/toolkits/computer_use/test_windows_backend.py
          tests/toolkits/computer_use/test_windows_text_io.py
          tests/toolkits/computer_use/test_windows_process.py
          tests/toolkits/computer_use/test_windows_ax_target.py
          tests/toolkits/computer_use/test_windows_ax_errors.py
          tests/toolkits/computer_use/test_windows_native_smoke.py

  windows-enterprise-tls:
    name: Windows enterprise TLS (real operating-system trust store)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --locked --group dev

      # The enterprise policy validates against the operating system's trust store through truststore, which reaches
      # CryptoAPI on Windows; the Linux jobs only exercise OpenSSL's store. The selection overrides the default
      # `not integration` filter because the loopback suites are integration-marked. Only files that build a TLS
      # context or complete a handshake are selected: `tests/toolkits/mcp/test_placeholders*.py` check which
      # environment a Node child receives and read no certificate store, so they run on the Linux jobs. One test
      # in the stdio integration file also runs a `chmod`-ed shebang script, which Windows cannot execute.
      - name: Run enterprise TLS tests
        run: >-
          uv run --no-sync pytest -n0 -q --tb=short -m "not e2e and not performance"
          tests/infra/test_tls_compat.py
          tests/infra/test_tls_compat_libraries.py
          tests/integration/test_enterprise_tls_compat_integration.py
          tests/integration/test_enterprise_tls_entrypoints_integration.py
          tests/integration/test_tls_certificate_rejection_integration.py

  linux-computer-use:
    name: Linux computer-use (real X11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # xvfb-run refuses to start without xauth, and --no-install-recommends skips it. python3-tk provides the
      # Tk text widget the tests type into (the system interpreter runs it).
      - name: Install X11 tools
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends
          xvfb xauth xdotool xclip x11-utils python3-tk

      - name: Install uv
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --locked --extra computer-use --group dev

      # The fake-tool suites cannot show whether text arrives intact in a real application; this file types and
      # pastes into a Tk text widget on an Xvfb display and compares the content character for character. It
      # moves the pointer, types and borrows the clipboard, hence the explicit opt-in variable.
      - name: Run Linux computer-use tests on Xvfb
        env:
          MYRM_REAL_X11_TESTS: "1"
        run: >-
          xvfb-run -a uv run --no-sync pytest -n0 -q --tb=short
          tests/toolkits/computer_use/test_linux_real_x11.py

  macos-computer-use:
    name: macOS computer-use (real pasteboard)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --locked --extra computer-use --group dev

      # The pasteboard suites use private named pasteboards (the runner's own clipboard stays untouched); on other
      # platforms they skip, so this is the only place they run. The conftest guard refuses real key events.
      - name: Run macOS computer-use tests
        run: >-
          uv run --no-sync pytest -n0 -q --tb=short
          tests/toolkits/computer_use/test_macos_pasteboard.py
          tests/toolkits/computer_use/test_real_input_guard.py

  browser-integration:
    name: Browser integration (serial Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Set up Python
        run: uv python install 3.13

      # The `integration or e2e` selection collects suites from every extra, so `[browser]` alone
      # fails at collection.
      - name: Install dependencies (all extras)
        run: uv sync --python 3.13 --locked --extra all --group dev

      - name: Install Patchright Chromium
        run: uv run --no-sync patchright install --with-deps chromium

      # A hung real-browser test dumps all thread stacks at 100 s (faulthandler) and the thread-based
      # per-test timeout aborts the run at 120 s, so a hang costs two minutes instead of the job timeout.
      - name: Run browser integration tests
        run: >-
          uv run --no-sync pytest -n0 -v --tb=short tests/
          -m "integration or e2e" --timeout=120 --timeout-method=thread -o faulthandler_timeout=100
          --junitxml=/tmp/browser.xml

      - name: Report failed tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, os, sys, xml.etree.ElementTree as ET

          rows = []
          for path in glob.glob("/tmp/*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          msg = (node.get("message") or "").strip().splitlines()[:2]
                          rows.append((case.get("classname"), case.get("name"), msg))

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Failed tests\n")
                  if not rows:
                      handle.write("No failures recorded in the junit report.\n")
                  for cls, name, msg in rows:
                      handle.write(f"- `{cls}::{name}`\n")
                      for line in msg:
                          handle.write(f"  - {line}\n")

          # Annotations are the only part of a failed job an anonymous reader can fetch,
          # so the failing test ids go there too.
          for cls, name, msg in rows[:40]:
              detail = " | ".join(msg).replace("\n", " ")[:180]
              print(f"::error title={cls}::{name}::{detail}")
          if not rows:
              print("::error title=failed-tests::no junit entries were written")
          sys.exit(0)
          EOF
