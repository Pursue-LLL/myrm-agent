name: Desktop release contracts

# The release pipeline is spread over the Tauri config, the sidecar build, the CI scripts and the workflows;
# these tests pin what those files must agree on.
# No path filter: the tests read files across the repository, and a list of paths stops covering a file the day a
# test starts reading it. tests/architecture/test_gate_workflow_triggers.py pins that neither trigger takes one.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: desktop-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Desktop release contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # CI has no LLM credentials: tests resolve model identifiers from the environment first, so
    # offline placeholders stand in for the developer-only .env.test.
    env:
      BASIC_MODEL: openai/ci-offline-placeholder
      LITE_MODEL: openai/ci-offline-placeholder
    defaults:
      run:
        working-directory: myrm-agent-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Set up Python
        run: uv python install 3.13

      - name: Install server dependencies
        run: uv sync --frozen --group dev

      # The trigger guard also runs here: server-architecture.yml reaches it after its other gates, so any earlier
      # failure there stops it, and a filter added to that workflow alone could skip the run that carries it.
      - name: Run the desktop contract tests and the gate trigger guard
        run: >-
          uv run --frozen pytest tests/architecture/test_desktop_*.py tests/architecture/test_gate_workflow_triggers.py
          -n0 --tb=short -q
