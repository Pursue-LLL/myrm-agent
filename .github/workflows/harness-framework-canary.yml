name: Harness framework canary

# The agent runs on LangChain and LangGraph, and uv.lock keeps one release of each. What users install is whatever
# pyproject.toml allows, so the two ends of that range are tested here: the lowest release it admits (is the floor true?)
# and the newest one inside its upper bound (does a release the lock has not met yet still run the agent?). Both run
# weekly and on demand, and on a pull request that changes the declared ranges, not on every harness change.

on:
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - 'myrm-agent-harness/pyproject.toml'
      - 'myrm-agent-harness/scripts/framework_requirements.py'
      - '.github/workflows/harness-framework-canary.yml'

permissions:
  contents: read

concurrency:
  group: harness-framework-canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The suites that build and run the real agent graph, hand it middleware and stream its events.
  FRAMEWORK_TESTS: >-
    tests/agent/middlewares tests/agent/_internals tests/agent/streaming tests/agent/sub_agents
    tests/agent/context_management tests/runtime/checkpointing

defaults:
  run:
    working-directory: myrm-agent-harness

jobs:
  framework:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lowest allowed LangChain and LangGraph
            mode: --floor
            install: ''
          - name: Newest allowed LangChain and LangGraph
            mode: --latest
            install: --upgrade

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --locked --extra all --group dev

      # The requirement lines come from pyproject.toml itself, so what is tested is what is declared; a package that
      # lacks a floor or an upper bound fails here before anything is installed.
      - name: Check the declared ranges
        run: uv run --no-sync python scripts/framework_requirements.py --check

      - name: Install the framework releases under test
        run: |
          uv run --no-sync python scripts/framework_requirements.py ${{ matrix.mode }} | tee "$RUNNER_TEMP/framework.txt"
          uv pip install --python .venv/bin/python ${{ matrix.install }} -r "$RUNNER_TEMP/framework.txt"
          uv pip list --python .venv/bin/python | grep -E '^(langchain|langgraph)'

      - name: Run the framework contract tests
        run: >-
          uv run --no-sync pytest -n 2 --dist=loadscope -q --tb=short
          $FRAMEWORK_TESTS
