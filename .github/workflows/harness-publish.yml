name: Harness publish

# Release: push a tag `harness-v<project.version>` (for example harness-v0.1.0rc6).
# The tag must equal myrm-agent-harness/pyproject.toml project.version. Publishing uses PyPI
# Trusted Publishing (OIDC); no API token is stored in this repository.
on:
  push:
    tags:
      - 'harness-v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: myrm-agent-harness

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Set up Python
        run: uv python install 3.13

      - name: Verify tag matches project.version
        run: python3 scripts/verify_release_tag.py

      - name: Build sdist and wheel
        run: uv build -o dist

      - name: Install wheel in a clean environment and verify
        run: |
          uv venv --python 3.13 /tmp/verify-venv
          uv pip install --python /tmp/verify-venv/bin/python dist/*.whl
          /tmp/verify-venv/bin/verify-harness-distribution

      - name: Upload distribution
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: harness-dist
          path: myrm-agent-harness/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/myrm-agent-harness/
    permissions:
      id-token: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: harness-dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Publish with Trusted Publishing
        run: uv publish --trusted-publishing always dist/*
