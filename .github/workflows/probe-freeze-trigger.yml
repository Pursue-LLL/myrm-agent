name: Probe freeze trigger (do not merge)

on:
  pull_request:
    paths:
      - '.github/workflows/probe-freeze-trigger.yml'

env:
  BASIC_MODEL: openai/ci-offline-placeholder
  LITE_MODEL: openai/ci-offline-placeholder

jobs:
  probe:
    name: probe ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: p00-91f3c577ea
            ref: 91f3c577ea757d6cc5b361c2cb25059e484b5822
          - variant: p01-4d23faea5f
            ref: 4d23faea5f4acc897cb17412d630c69ae9ca75ff
          - variant: p03-0655d9f57f
            ref: 0655d9f57fa833a6068079b1c2c86a759f58f760
          - variant: p04-d63eb5d15d
            ref: d63eb5d15d51d5d0ed56c1cbd3d033800f4d26cf
          - variant: p10-980814cacf
            ref: 980814cacf88fa116ab466ca6662347924d2090b
          - variant: p11-2008529e0a
            ref: 2008529e0a9ab3db7301abcadb200d749ad39f0e
          - variant: p14-0e5a00649a
            ref: 0e5a00649aada635e21b007ab3e5452ccc09e279
          - variant: p17-66f4ac6f45
            ref: 66f4ac6f45a43473da722c7a29af38dbeb1e3c37
          - variant: p18-22ca35e377
            ref: 22ca35e3779cb5627e473e47d6d7077a6fdef350
          - variant: p20-8a78b7aeae
            ref: 8a78b7aeaeaff76e4a7516d943b32101a29c56ba
          - variant: p21-75d20eaaae
            ref: 75d20eaaae5241e8bc713847085752cc0e13e073
          - variant: p25-0b753b3b1a
            ref: 0b753b3b1a65f6b2bf55270efe9ac6938c4b5995
          - variant: p42-a4975c6dca
            ref: a4975c6dca092ec200583a86d92e573c8766c61f
          - variant: p53-c2901b7cfd
            ref: c2901b7cfdc1431eb027fcd3c1293067cb3faf69
    defaults:
      run:
        working-directory: myrm-agent-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.ref }}

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Set up Python
        run: uv python install 3.13

      - name: Install promtool
        run: bash scripts/ci/install_promtool.sh

      - name: Install the locked dependencies
        run: uv sync --frozen --group dev

      - name: Run the default suite for 18 minutes
        run: |
          set +e
          git log -1 --format='checked out: %H %cI %s'
          PYTHONUNBUFFERED=1 timeout -s INT -k 30 1080 .venv/bin/python -m pytest -n0 --tb=short -v -p no:cacheprovider -o faulthandler_timeout=120
          echo "pytest exit status: $?"
