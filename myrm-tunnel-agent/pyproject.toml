[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myrm-tunnel-agent"
version = "0.1.0"
description = "Myrm Tunnel Agent — connects on-premise MCP servers to Myrm cloud sandboxes via outbound-only reverse tunnel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
myrm-tunnel-agent = "myrm_tunnel_agent.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myrm_tunnel_agent"]
