  - "为公司即将举办的 200 人年度战略宣讲会制定全流程会务筹备进度表与物料清单"
  - "设计一份规范的办公固定资产采购审批与盘点登记 Excel 模板"
  - "根据本次管理层例会的录音纪要要点，整理一份包含决议事项与责任追踪的会议纪要"
