suggestion_prompts:
  - "帮我审核这份差旅报销清单，根据差旅标准核验住宿、打车与餐饮报销合规性"
  - "制作一张月度部门预算执行率与支出明细对比表（要求 Excel 公式自动计算偏差与达成率）"
  - "请对这份简易资产负债表与利润表进行勾稽关系检查，指出不平衡的科目"
  - "Build an annual cash flow projection Excel model with sensitivity analysis formulas"
