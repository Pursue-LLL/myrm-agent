repos:
  - repo: local
    hooks:
      - id: harness-boundary-check
        name: Harness/Business Boundary Check
        entry: bash -c 'cd myrm-agent-harness && python scripts/boundary_check.py --incremental'
        language: system
        pass_filenames: false
        files: ^myrm-agent-harness/
        description: "Enforce framework-business separation (incremental: only changed files)"

      - id: harness-tool-registry-check
        name: Harness Tool Registry Consistency
        entry: bash -c 'cd myrm-agent-harness && python scripts/validate_tool_registry.py --incremental'
        language: system
        pass_filenames: false
        files: ^myrm-agent-harness/
        description: "Enforce @tool registration in _TOOL_LAYERS and layer-product consistency (incremental: changed files + static layer gate)"

      - id: harness-fractal-docs-check
        name: Harness Fractal Docs Coverage
        entry: bash -c 'cd myrm-agent-harness && python scripts/check_fractal_docs.py'
        language: system
        pass_filenames: false
        files: ^myrm-agent-harness/
        description: "Ensure every Python module directory under src/myrm_agent_harness has _ARCH.md"

      - id: harness-arch-inventory-check
        name: Harness _ARCH File Inventory
        entry: bash -c 'cd myrm-agent-harness && python scripts/validate_arch_inventory.py --root src/myrm_agent_harness'
        language: system
        pass_filenames: false
        files: ^myrm-agent-harness/
        description: "Ensure _ARCH.md file tables list every sibling .py module"

      - id: harness-line-limit-check
        name: Harness File Line Limit
        entry: bash -c 'cd myrm-agent-harness && python scripts/check_file_line_limit.py --incremental'
        language: system
        pass_filenames: false
        files: ^myrm-agent-harness/
        description: "Reject .py files exceeding the 500-line cap or their baseline allowance (incremental: changed files only)"

      - id: harness-test-source-assertion-check
        name: Harness Test Source-Text Assertion Check
        entry: bash -c 'cd myrm-agent-harness && python scripts/check_test_source_assertions.py --incremental'
        language: system
        pass_filenames: false
        files: ^myrm-agent-harness/
        description: "Reject tests asserting on raw .py source text; assert on the ast tree so reformatting cannot break them (incremental: changed tests only)"

      - id: server-fractal-docs-check
        name: Server Fractal Docs Coverage
        entry: >-
          bash -c 'cd myrm-agent-server &&
          python3 scripts/check_fractal_docs.py &&
          python3 scripts/check_fractal_docs.py --strict-headers --header-baseline tests/architecture/data/fractal_header_baseline.txt &&
          python3 scripts/check_fractal_docs.py --no-stub'
        language: system
        pass_filenames: false
        files: ^myrm-agent-server/(app/|scripts/check_fractal_docs\.py$|tests/architecture/data/fractal_header_baseline\.txt$)
        description: "Ensure every directory under app/ has _ARCH.md, every non-trivial module has a file header, and no _ARCH.md in the guarded paths is a stub (the same three commands as the server-fractal-docs CI job)"

      - id: frontend-fractal-docs-check
        name: Frontend Fractal Docs Coverage
        entry: bash -c 'cd myrm-agent-frontend && python3 scripts/check_fractal_docs.py --no-stub'
        language: system
        pass_filenames: false
        files: ^myrm-agent-frontend/(src/|scripts/check_fractal_docs\.py$|scripts/ci/fractal_docs_baseline\.txt$)
        description: "Ensure strict roots and every recursive-scan directory with .ts/.tsx source has _ARCH.md (same command as the frontend-build CI job)"
