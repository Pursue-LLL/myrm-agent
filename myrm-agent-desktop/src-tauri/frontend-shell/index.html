<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyrmAgent</title>
    <style>
      :root {
        --bg: #09090b;
        --card: #121215;
        --border: #27272a;
        --text: #f4f4f5;
        --muted: #71717a;
        --accent: #3b82f6;
        --shimmer: linear-gradient(90deg, #18181b 0%, #27272a 50%, #18181b 100%);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      /* Top window bar */
      .top-bar {
        height: 44px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px 0 80px; /* Leave space for macOS traffic lights */
        background: rgba(18, 18, 21, 0.6);
        backdrop-filter: blur(12px);
        -webkit-app-region: drag;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .brand-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 10px #10b981;
        animation: pulse 2s infinite;
      }
      .status-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.78rem;
        color: var(--muted);
        background: #18181b;
        padding: 4px 10px;
        border-radius: 9999px;
        border: 1px solid var(--border);
        -webkit-app-region: no-drag;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.5s infinite;
      }
      /* Main layout */
      .layout {
        flex: 1;
        display: flex;
        height: calc(100vh - 44px);
      }
      /* Sidebar skeleton */
      .sidebar {
        width: 250px;
        border-right: 1px solid var(--border);
        background: #0d0d10;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .btn-skeleton {
        height: 36px;
        border-radius: 8px;
        background: var(--shimmer);
        background-size: 200% 100%;
        animation: shimmer 2s infinite linear;
      }
      .list-skeleton {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 8px;
      }
      .item-skeleton {
        height: 28px;
        border-radius: 6px;
        background: var(--shimmer);
        background-size: 200% 100%;
        animation: shimmer 2s infinite linear;
      }
      /* Workspace main canvas */
      .workspace {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 32px;
      }
      .hero {
        text-align: center;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .logo-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        animation: breathe 3s ease-in-out infinite;
      }
      .hero-title {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text);
      }
      .hero-sub {
        font-size: 0.85rem;
        color: var(--muted);
        line-height: 1.5;
      }
      .input-skeleton {
        position: absolute;
        bottom: 28px;
        width: min(680px, calc(100% - 48px));
        height: 52px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #111114;
        display: flex;
        align-items: center;
        padding: 0 16px;
      }
      .input-placeholder {
        width: 140px;
        height: 14px;
        border-radius: 4px;
        background: var(--shimmer);
        background-size: 200% 100%;
        animation: shimmer 2s infinite linear;
      }
      /* Error overlay */
      #error-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        z-index: 100;
        place-items: center;
        padding: 24px;
      }
      .error-card {
        max-width: 440px;
        width: 100%;
        background: #18181b;
        border: 1px solid #7f1d1d;
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
        text-align: left;
      }
      .error-title {
        color: #f87171;
        font-size: 1.05rem;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .error-message {
        font-size: 0.88rem;
        color: #d4d4d8;
        line-height: 1.6;
        word-break: break-word;
      }
      /* The raw reason is selectable so it can be pasted into a bug report. */
      .error-detail {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        font-size: 0.78rem;
        color: var(--muted);
        line-height: 1.5;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); border-color: var(--border); }
        50% { transform: scale(1.04); border-color: #3b82f6; box-shadow: 0 0 24px rgba(59, 130, 246, 0.25); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="top-bar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <span class="brand-dot"></span>
        <span>MyrmAgent</span>
      </div>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span data-i18n="status"></span>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="btn-skeleton"></div>
        <div class="list-skeleton">
          <div class="item-skeleton" style="width: 85%;"></div>
          <div class="item-skeleton" style="width: 95%;"></div>
          <div class="item-skeleton" style="width: 70%;"></div>
          <div class="item-skeleton" style="width: 80%;"></div>
        </div>
      </aside>

      <main class="workspace">
        <div class="hero">
          <div class="logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/>
            </svg>
          </div>
          <h1 class="hero-title" data-i18n="heroTitle"></h1>
          <p class="hero-sub" data-i18n="heroSub"></p>
        </div>

        <div class="input-skeleton">
          <div class="input-placeholder"></div>
        </div>
      </main>
    </div>

    <div id="error-modal">
      <div class="error-card">
        <h2 id="error-title" class="error-title"></h2>
        <p id="error-desc" class="error-message"></p>
        <p id="error-detail" class="error-detail" hidden></p>
      </div>
    </div>

    <!-- All visible copy: zh for any Chinese system language, en otherwise. Both languages must
         define the same keys; scripts/ci/verify-launch-contract.sh enforces it. -->
    <script type="application/json" id="shell-copy">
      {
        "zh": {
          "status": "正在启动本地 AI 内核…",
          "heroTitle": "Myrm AI 个人工作站",
          "heroSub": "本地专属沙箱与安全中枢正在就绪，马上进入工作台…",
          "frontendFailedTitle": "客户端启动异常",
          "frontendFailed": "前端渲染服务启动失败。请重启应用或检查 WebUI 端口设置。",
          "backendFailedTitle": "AI 后端未就绪",
          "backendFailed": "本地 AI 后端未能正常响应。请检查端口是否被占用。"
        },
        "en": {
          "status": "Starting the local AI engine…",
          "heroTitle": "Myrm AI Personal Workstation",
          "heroSub": "Your private sandbox and security hub are getting ready. Opening your workspace shortly…",
          "frontendFailedTitle": "The app couldn't start",
          "frontendFailed": "The interface service failed to start. Restart the app, or check the WebUI port in Settings.",
          "backendFailedTitle": "The AI engine isn't ready",
          "backendFailed": "The local AI engine didn't respond. Check whether its port is already in use."
        }
      }
    </script>

    <script>
      const shellCopy = JSON.parse(document.getElementById("shell-copy").textContent);
      const locale = navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
      const t = (key) => shellCopy[locale][key];

      document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });

      // Guidance is localized; the raw reason from Rust stays as selectable detail.
      function showFailure(title, guidance, reason) {
        document.getElementById("error-title").textContent = title;
        document.getElementById("error-desc").textContent = guidance;
        const detail = document.getElementById("error-detail");
        detail.textContent = reason;
        detail.hidden = !reason;
        document.getElementById("error-modal").style.display = "grid";
      }
      const showFrontendFailure = (reason) =>
        showFailure(t("frontendFailedTitle"), t("frontendFailed"), reason);
      const showBackendFailure = (reason) =>
        showFailure(t("backendFailedTitle"), t("backendFailed"), reason);
      const reasonOf = (payload) => (typeof payload === "string" ? payload : "");

      // A very early backend failure can race the event listener; the shell URL carries
      // the reason so the modal is guaranteed to render on this load.
      const startupError = new URLSearchParams(window.location.search).get("startup_error");
      const listen = window.__TAURI__?.event?.listen;
      if (startupError) {
        showBackendFailure(startupError);
      } else if (listen) {
        listen("frontend-start-failed", (event) => showFrontendFailure(reasonOf(event.payload)));
        listen("backend-start-failed", (event) => showBackendFailure(reasonOf(event.payload)));
      }
    </script>
  </body>
</html>
