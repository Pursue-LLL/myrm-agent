<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyrmAgent</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0a0a0a;
        color: #e5e5e5;
        padding: 2rem;
        text-align: center;
      }
      #card {
        max-width: 32rem;
        padding: 2rem 2.25rem;
        border: 1px solid #262626;
        border-radius: 14px;
        background: #111111;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
        text-align: left;
      }
      #title {
        margin: 0 0 0.75rem;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #status {
        margin: 0;
        line-height: 1.6;
        color: #d4d4d4;
      }
      #card.error {
        border-color: #7f1d1d;
      }
      #card.error #title {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <h1 id="title">MyrmAgent</h1>
      <p id="status">正在启动本地服务…</p>
    </div>
    <script>
      const host = "127.0.0.1";
      let stopped = false;

      function showError(message) {
        stopped = true;
        document.getElementById("title").textContent = "启动失败";
        document.getElementById("status").textContent = message;
        document.getElementById("card").classList.add("error");
      }

      function showBackendWarning(message) {
        document.getElementById("title").textContent = "后端未就绪";
        document.getElementById("status").textContent = message;
        document.getElementById("card").classList.add("error");
      }

      function bindFailureListener() {
        const listen = window.__TAURI__?.event?.listen;
        if (!listen) {
          return;
        }
        listen("frontend-start-failed", (event) => {
          const message =
            typeof event.payload === "string" && event.payload
              ? event.payload
              : "UI failed to start. Restart MyrmAgent or change the WebUI port in Settings.";
          showError(message);
        });
        listen("backend-start-failed", (event) => {
          const message =
            typeof event.payload === "string" && event.payload
              ? event.payload
              : "Backend failed to start. Opening UI…";
          showBackendWarning(message);
        });
      }

      async function start() {
        // 只负责展示启动/失败状态；导航由 Rust 侧在它自己拉起的 Next 就绪后统一触发，
        // 避免本页面抢先跳到占用同一端口的其它服务（会渲染出残缺界面）。
        bindFailureListener();
        document.getElementById("status").textContent = "正在启动本地服务…";
      }

      start();
    </script>
  </body>
</html>
